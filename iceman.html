<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake Said - Iceman</title>
    
    <!-- GSAP Core + ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <style>
        @font-face {
            font-family: 'Xanh Mono';
            src: url('fonts/lyrics/XanhMono-Regular.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Moonscape';
            src: url('fonts/title/Moonscape Demo.otf') format('opentype');
        }

        /* Header Fonts */
        @font-face {
            font-family: 'Amonk Outline';
            src: url('fonts/amonk/Amonk Outline.otf') format('opentype');
        }
        
        @font-face {
            font-family: 'Combat Sport';
            src: url('fonts/combat_sport/Combat Sport.otf') format('opentype');
        }
        
        @font-face {
            font-family: 'Drake Viewz';
            src: url('fonts/drake_viewz/DrakeViewz-Regular.otf') format('opentype');
        }
        
        @font-face {
            font-family: 'Iced Latte';
            src: url('fonts/iced_latte/Iced Latte.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Ice Princess';
            src: url('fonts/iceprincess/IcePrincess.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Organical';
            src: url('fonts/organical/ORGANICAL PERSONAL USE.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Playfair Display';
            src: url('fonts/playfair/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Playfair Display Bold';
            src: url('fonts/playfair/static/PlayfairDisplay-Bold.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Playfair Display Black';
            src: url('fonts/playfair/static/PlayfairDisplay-Black.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Top View';
            src: url('fonts/top_view/Top View.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Winter Ice';
            src: url('fonts/winterice/WinterIce.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
        }

        body {
            background-color: #e8f4f8;
            color: #1a1a1a;
            font-family: 'Xanh Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            opacity: 0;
        }

        header h1 {
            font-family: 'Amonk Outline', sans-serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Album Navigation --- */
        .album-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 1rem 2rem;
            overflow-x: auto;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .album-nav img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .album-nav img:hover {
            opacity: 0.8;
        }

        .album-nav img.active {
            opacity: 1;
            border: 2px solid #1a1a1a;
            transform: scale(1.05);
        }

        /* --- Lyrics Section --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 10%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            opacity: 0;
        }

        .song-title {
            font-family: 'Moonscape', sans-serif;
            color: #666666;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(20px);
        }

        .lyric-text {
            font-family: 'Xanh Mono', monospace;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 400;
            line-height: 1.3;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Music Links */
        .music-links {
            margin-top: 3rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(20px);
        }

        .music-link {
            font-family: 'Xanh Mono', monospace;
            font-size: 14px;
            color: #1a1a1a;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
        }

        .music-link:hover {
            background: #1a1a1a;
            color: #e8f4f8;
            transform: translateY(-2px);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .album-nav {
                justify-content: flex-start;
            }
            main {
                padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>DRAKE SAID</h1>
    </header>

    <nav class="album-nav">
        <img src="iceman_cover.png" alt="Iceman" class="active">
    </nav>

    <main>
        <div class="song-title">WHISPER MY NAME</div>
        <div class="lyric-text">
            WHISPER MY NAME AND DON'T SAY IT TOO LOUD<br>
            'CAUSE YOU GOTTA COME HERE AND YOU KNOW I POP OUT
        </div>
        
        <div class="music-links">
            <a href="#" class="music-link">Spotify</a>
            <a href="#" class="music-link">YouTube</a>
            <a href="#" class="music-link">Apple Music</a>
        </div>
    </main>

</body>
</html>
    <script>
        // Initialize Lenis smooth scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true,
            smoothTouch: false
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Register GSAP plugins
        gsap.registerPlugin(ScrollTrigger);

        // Font cycling animation for header
        const fonts = [
            'Amonk Outline',
            'Combat Sport',
            'Drake Viewz',
            'Iced Latte',
            'Ice Princess',
            'Organical',
            'Playfair Display',
            'Playfair Display Bold',
            'Playfair Display Black',
            'Top View',
            'Winter Ice'
        ];
        
        let currentFontIndex = 0;
        let animationInterval;

        function updateHeadingFont() {
            const heading = document.querySelector('header h1');
            heading.style.fontFamily = fonts[currentFontIndex];
            currentFontIndex = (currentFontIndex + 1) % fonts.length;
        }

        function startAnimation() {
            animationInterval = setInterval(updateHeadingFont, 500);
        }

        // GSAP Animations on page load
        window.addEventListener('load', () => {
            // Create animation timeline
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            // Animate header
            tl.to('header', {
                opacity: 1,
                duration: 1
            })
            // Animate main content
            .to('main', {
                opacity: 1,
                duration: 0.8
            }, '-=0.5')
            // Animate song title
            .to('.song-title', {
                opacity: 1,
                y: 0,
                duration: 0.8
            }, '-=0.4')
            // Animate lyrics
            .to('.lyric-text', {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: 'power2.out'
            }, '-=0.3')
            // Animate music links
            .to('.music-links', {
                opacity: 1,
                y: 0,
                duration: 0.8
            }, '-=0.5');

            // Start font animation
            startAnimation();
        });

        // Scroll-triggered animations for lyrics
        gsap.utils.toArray('.lyric-text').forEach(lyric => {
            gsap.from(lyric, {
                scrollTrigger: {
                    trigger: lyric,
                    start: 'top 80%',
                    end: 'top 20%',
                    scrub: 1
                },
                opacity: 0.3,
                scale: 0.95
            });
        });
    </script>
</body>
</html>
