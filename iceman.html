<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake Said - Iceman</title>
    <style>
        @font-face {
            font-family: 'Xanh Mono';
            src: url('fonts/lyrics/XanhMono-Regular.ttf') format('truetype');
        }
        
        @font-face {
            font-family: 'Moonscape';
            src: url('fonts/title/Moonscape Demo.otf') format('opentype');
        }

        @font-face {
            font-family: 'Amonk Outline';
            src: url('fonts/amonk/Amonk Outline.otf') format('opentype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e8f4f8;
            color: #1a1a1a;
            font-family: 'Xanh Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.6s ease;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }

        header h1 {
            font-family: 'Amonk Outline', sans-serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Album Navigation --- */
        .album-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 1rem 2rem;
            overflow-x: auto;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .album-nav img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .album-nav img:hover {
            opacity: 0.8;
        }

        .album-nav img.active {
            opacity: 1;
            border: 2px solid #1a1a1a;
            transform: scale(1.05);
        }

        /* --- Lyrics Section --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 10%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .song-title {
            font-family: 'Moonscape', sans-serif;
            color: #666666;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .lyric-text {
            font-family: 'Xanh Mono', monospace;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 400;
            line-height: 1.3;
            text-transform: uppercase;
        }

        /* Music Links */
        .music-links {
            margin-top: 3rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .music-link {
            font-family: 'Xanh Mono', monospace;
            font-size: 14px;
            color: #1a1a1a;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .music-link:hover {
            background: #1a1a1a;
            color: #e8f4f8;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .album-nav {
                justify-content: flex-start;
            }
            main {
                padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>DRAKE SAID</h1>
    </header>

    <nav class="album-nav">
        <img src="iceman_cover.png" alt="Iceman" class="active">
    </nav>

    <main>
        <div class="song-title">WHISPER MY NAME</div>
        <div class="lyric-text">
            WHISPER MY NAME AND DON'T SAY IT TOO LOUD<br>
            'CAUSE YOU GOTTA COME HERE AND YOU KNOW I POP OUT
        </div>
        
        <div class="music-links">
            <a href="#" class="music-link">Spotify</a>
            <a href="#" class="music-link">YouTube</a>
            <a href="#" class="music-link">Apple Music</a>
        </div>
    </main>

</body>
</html>
